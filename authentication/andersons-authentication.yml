note: >-
  The Andersons publishes no public API and therefore no API authentication reference.
  What it DOES publish, anonymously and machine-readably, is the OpenID Connect discovery
  document for the Active Directory Federation Services deployment that authenticates its
  customer-facing portals. This artifact records that federation surface exactly as the
  provider serves it — it is identity infrastructure for GRAINweb, SmartTicket and the
  account portal, NOT the auth model of a developer-facing API. Do not read it as evidence
  that an API exists.
scope: >-
