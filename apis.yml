aid: andersons
name: The Andersons
description: >-
  The Andersons, Inc. (NASDAQ: ANDE) is a diversified North American agribusiness
  headquartered in Maumee, Ohio and founded in 1947, operating across four segments:
  Agribusiness / commodity merchandising through The Andersons Trade Group grain
  elevators and terminals, Nutrient & Industrial through The Andersons Plant Nutrient
  Group and its turf and specialty products, Renewables through its ethanol production
  and marketing joint ventures, and premium food and pet-food ingredients. The company
  publishes NO public developer API, no developer portal, no OpenAPI or other
  machine-readable contract, and no SDKs. Its customer-facing digital surface is a set of
  authenticated end-user applications — the GRAINweb grain account portal, the Farm2Market
  SmartTicket delivery-ticket web app at andersonstickets.com, the AndeConnect and Trade
  Group mobile apps (the AndeConnect app is operated on the company's behalf by the ag
  platform vendor Bushel), and portal.andersonsinc.com account management — all federated
  through an Active Directory Federation Services identity provider at
  portalauth.andersonsinc.com. Business-to-business integration is handled through EDI and
  direct merchant relationships rather than a self-service API. NOTE ON IDENTITY: the
  domain andersons.com belongs to Anderson's of White Bear Lake, Minnesota, an unrelated
  prom and school-spirit party-supply retailer; The Andersons, Inc. is at andersonsinc.com.
